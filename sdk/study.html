<!doctype html>
<!--
  User-study page (recovery plan T4.3), served by the gateway at /study.html. The extension's study
  mode opens it; the participant never has to type an address.

    /study.html?mode=enrol&p=<pseudonym>&k=<study site key>
      Binds the participant (POST /v1/sdk/study/register) BEFORE enrolment, so the enrolment
      trainings are logged, then runs the SDK's own onboarding: passkey, 5 keystroke samples,
      8 mouse samples. All training is server-side, exactly as for any SDK user.
    /study.html?mode=verify&p=<pseudonym>&k=<study site key>&reason=keystroke|mouse
      The passkey step-up after a study-mode lock. A verified passkey clears the server lock
      (gateway /v1/sdk/passkey/auth/complete); the outcome is posted to this window as
      {type: "continuum-ext-passkey"}, which the extension's content script relays.

  Passkeys are bound to this page's origin, so enrolment and every step-up happen here.
  The SDK session uses externalId "study:<pseudonym>", the same identity the extension uses.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Continuum Study</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --ok: #15803d; --bad: #b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --card: #111827; --text: #e5e7eb; --muted: #94a3b8; --line: #1f2937; --ok: #4ade80; --bad: #f87171; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: var(--muted); margin: 6px 0; }
    #status { margin-top: 14px; font-weight: 600; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1 id="title">Continuum study</h1>
      <p id="lead"></p>
      <p id="status"></p>
    </div>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var mode = q.get("mode") === "verify" ? "verify" : "enrol";
      var participant = q.get("p") || "", siteKey = q.get("k") || "", reason = q.get("reason") === "mouse" ? "mouse" : "keystroke";
      var statusEl = document.getElementById("status");
      function status(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }
      function post(msg) { try { window.postMessage(Object.assign({ type: "continuum-ext-passkey", action: "verify" }, msg), location.origin); } catch (e) {} }

      if (!/^[A-Za-z0-9_-]{1,32}$/.test(participant) || !siteKey) {
        status("This page was opened without a valid participant or site key. Open it from the extension.", "bad");
        return;
      }
      document.getElementById("title").textContent = mode === "enrol" ? "Enrolment, participant " + participant : "Verify it's you";
      document.getElementById("lead").textContent = mode === "enrol"
        ? "Set up your passkey, then type the five texts and move the mouse as asked. It takes about 15 minutes."
        : "The extension locked your session. Verify with your passkey to continue.";

      function loadGuard(ksAndMouse) {
        var s = document.createElement("script");
        s.src = "/guard.js";
        s.setAttribute("data-site-key", siteKey);
        s.setAttribute("data-external-id", "study:" + participant);
        s.setAttribute("data-keystroke", ksAndMouse ? "on" : "off");
        s.setAttribute("data-mouse", ksAndMouse ? "on" : "off");
        s.setAttribute("data-onboarding", "eager");
        document.body.appendChild(s);
      }
      function whenReady(cb) {
        var t0 = Date.now();
        (function wait() {
          if (window.Continuum && window.Continuum.onReady) return window.Continuum.onReady(cb);
          if (Date.now() - t0 > 20000) return status("The Continuum SDK did not load. Is the gateway running?", "bad");
          setTimeout(wait, 100);
        })();
      }

      if (mode === "enrol") {
        // Bind the pseudonym first: trainings queued by the enrolment are then logged with all
        // their threshold-source scores.
        status("Registering participant…");
        fetch("/v1/sdk/session", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ siteKey: siteKey, externalId: "study:" + participant }) })
          .then(function (r) { return r.json(); })
          .then(function (s) {
            if (!s.token) throw new Error(s.error || "no session");
            return fetch("/v1/sdk/study/register", { method: "POST",
              headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.token },
              body: JSON.stringify({ participant: participant }) }).then(function (r) { return r.json(); });
          })
          .then(function (r) {
            if (!r.ok) throw new Error(r.error || "registration refused");
            status("Registered. Follow the steps in the Continuum window.", "ok");
            loadGuard(true);
          })
          .catch(function (e) { status("Could not register: " + e.message, "bad"); });
        return;
      }

      // verify
      loadGuard(false);
      whenReady(function () {
        status("Waiting for your passkey…");
        window.Continuum.requireStepUp(reason,
          function () { status("Verified. You can close this tab.", "ok"); post({ ok: true }); },
          function (err) { status("Not verified: " + err + ". Try again.", "bad"); post({ ok: false, error: String(err).slice(0, 80) }); });
      });
    })();
  </script>
</body>
</html>
