# Minimal deploy for the BROWSER EXTENSION's passkey step-up — the extension talks to
# passkey-service DIRECTLY (never through the gateway), so this is the only image it
# needs. Publishes the port to the host (docker-compose.bundle.yml only `expose`s it
# for internal use by the gateway, which isn't enough for a browser-facing endpoint).
#
# Usage:
#   REGISTRY=<dockerhub-user> TAG=<version> RP_ID=auth.example.com \
#     PUBLIC_ORIGIN=https://auth.example.com \
#     docker compose -f docker-compose.passkey-standalone.yml up -d
#
# Then point the extension at it: chrome-extension://<id>/src/options.html
# -> Passkey service URL = https://auth.example.com (or whatever PORT/host you exposed).
#
# WebAuthn requires HTTPS for any real domain (localhost is the one exception) — put
# this behind a TLS-terminating reverse proxy for anything beyond local dev/demo use.
services:
  passkey-service:
    image: ${REGISTRY:?Set REGISTRY (Docker Hub user or ghcr.io/<owner>)}/passkey-service:${TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 4000
      RP_ID: ${RP_ID:-localhost}
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4000}
      DB_PATH: /app/data/passkey.db
      # Left blank: the extension's /ext/* pages can't attach a server API key (see
      # services/passkey-service/server.js's auth middleware, which already exempts them).
      PASSKEY_API_KEY: ${PASSKEY_API_KEY:-}
    ports:
      - "${PASSKEY_PORT:-4000}:4000"
    volumes:
      - continuum_passkey_standalone_db:/app/data

volumes:
  continuum_passkey_standalone_db:
