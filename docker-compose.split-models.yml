# Added on top of docker-compose.side-by-side.yml: the model service in its two roles, with the per-user
# models in object storage, as in Kubernetes.
#   model-api        the TRAINER (MODEL_ROLE=trainer): trains, stores each new version in the object store
#   model-inference  two SCORING copies (MODEL_ROLE=inference), behind a balancer that alternates every
#                    request (scripts/dev/round-robin.js). Their model folder is an empty in-memory disk, so
#                    every model they score with comes from the object store (MODEL_STORE=s3)
#   seaweedfs        the object store (S3 API), local credentials from deploy/seaweedfs/s3-local.json
# Running the end-to-end suites through it proves a trained model reaches every scoring copy, and that no
# scoring copy needs the trainer's disk.
#
#   docker compose -p continuum-next -f docker-compose.yml -f docker-compose.side-by-side.yml \
#     -f docker-compose.split-models.yml --profile model up -d
#   (models made before: ... run --rm --no-deps model-api python model_store.py publish-all)
x-model-store: &model-store
  MODEL_STORE: s3
  MODEL_S3_ENDPOINT: http://seaweedfs:8333
  MODEL_S3_BUCKET: models
  MODEL_S3_ACCESS_KEY: continuum-models          # a throwaway local store; real ones come from a secret
  MODEL_S3_SECRET_KEY: local-only-models-secret

services:
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    networks: [model]
    volumes:
      - seaweedfs_data:/data
      - ./deploy/seaweedfs/s3-local.json:/etc/seaweedfs/s3.json:ro

  model-api:
    environment:
      <<: *model-store
      MODEL_ROLE: trainer
    depends_on:
      seaweedfs:
        condition: service_started

  model-inference:
    profiles: [model]
    build:
      context: .
      dockerfile: services/model-api/Dockerfile.model
    deploy:
      replicas: 2
    environment:
      <<: *model-store
      MODEL_ROLE: inference
      MODEL_HOST: 0.0.0.0
      MODEL_PORT: 5000
      MODEL_PATH: ${MODEL_PATH:-/app/artifacts/ws50-gru/final_model}
      MODEL_UNITS: ${MODEL_UNITS:-32}
      MODEL_API_KEY: ${MODEL_API_KEY:-dev-model-api-key}
      ARTIFACTS_DIR: /app/artifacts
      DATA_DIR: /app/data
    expose: ["5000"]
    networks: [model]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    volumes:
      - .:/app
      - type: tmpfs              # this copy's model cache: empty at start, filled from the object store
        target: /app/artifacts/users
    working_dir: /app/services/model-api
    command: ["gunicorn", "-c", "gunicorn.conf.py", "wsgi:app"]
    depends_on:
      seaweedfs:
        condition: service_started

  model-lb:
    profiles: [model]
    image: node:24-bookworm-slim
    command: ["node", "/lb/round-robin.js"]
    environment:
      UPSTREAM: model-inference:5000
      PORT: "5000"
    volumes:
      - ./scripts/dev/round-robin.js:/lb/round-robin.js:ro
    networks: [model]
    depends_on:
      model-inference:
        condition: service_healthy

  ca-service:
    environment:
      MODEL_INFER_URL: http://model-lb:5000
      MODEL_TRAIN_URL: http://model-api:5000
    depends_on:
      model-lb:
        condition: service_started

volumes:
  seaweedfs_data:
