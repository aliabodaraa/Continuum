# The reference DEMO on its own machine: the Continuum product (docker-compose.bundle.yml: gateway,
# ca-service, passkey-service, model-api) and, next to it, the demo web app as an ordinary TENANT.
# The demo reaches Continuum only through the gateway's public API (its browser pages through the SDK,
# its backend through the tenant API /v1/server/*), exactly as any organisation's app would. It has no
# address or key for an internal service and sits only on the public `edge` network.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Everything is baked into the images (no bind mounts); runtime state lives on named volumes. Set the
# bundle's required secrets in .env (see .env.example), plus SESSION_SECRET for the demo. For the demo's
# sign-in to the browser extension and its risk-change pushes, also set in .env:
#   DEMO_SIGNIN_URL=http://localhost:3000/continuum/link
#   DEMO_WEBHOOK_URL=http://web:3000/continuum/events
# To serve on a real domain, set PUBLIC_ORIGIN (and GATEWAY_PUBLIC_URL) to it: passkeys are bound to it.
include:
  - docker-compose.bundle.yml

services:
  web:
    build:
      context: ./apps/demo
      dockerfile: Dockerfile
      # Inject the top-level SDK so the image serves /guard.js without a mount.
      additional_contexts:
        sdk: ./sdk
    image: ${REGISTRY:-continuum}/web-demo:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      PORT: 3000
      # This app's website: the relying party of its users' passkeys. Must match the URL the browser
      # uses, and be one of the demo organisation's origins.
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      RP_ID: ${RP_ID:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # REQUIRED — signs session cookies. Generate: openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (openssl rand -hex 32)}
      # Continuum's public API for this app's backend, and as browsers reach it.
      GATEWAY_URL: http://gateway:8080
      CONTINUUM_GATEWAY_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      # The demo organisation: its site key and its tenant secret (the gateway seeds pk_demo with
      # CA_SIGNING_SECRET). Identity tokens are signed with it; verdicts are checked against the JWKS.
      CONTINUUM_SITE_KEY: pk_demo
      CONTINUUM_SECRET: ${CA_SIGNING_SECRET:?Set CA_SIGNING_SECRET in .env (openssl rand -hex 32)}
      CONTINUUM_JWKS_URI: http://gateway:8080/.well-known/jwks.json
      ONBOARDING_MODE: ${ONBOARDING_MODE:-eager}
      LOG_FORMAT: ${LOG_FORMAT:-}
      # SQLite lives on a volume (NOT in /app/db, which holds source).
      DB_PATH: /app/data/continuum.db
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [edge]
    volumes:
      - continuum_db:/app/data                 # SQLite: the demo's own users
      - continuum_uploads:/app/public/uploads  # profile photos

volumes:
  continuum_db:
  continuum_uploads:
