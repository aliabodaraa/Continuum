# This PC (Docker Desktop's Kubernetes): one copy of each service, images built here (tag "local"), the API
# on http://localhost:28080, the demo on http://localhost:23000 and Acme on http://localhost:24200, so it runs
# beside the Compose stacks (8080/3000/4200 and 18080/13000). The secrets are files in secrets/
# (git-ignored), made by scripts/k8s-local.sh secrets. overlays/live is this overlay on the usual addresses.
#   kubectl apply -k deploy/k8s/overlays/local        (scripts/k8s-local.sh deploy does this)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/continuum
  - ../../base/storage
  - ../../base/demo
  - ../../base/observability    # the services' traces and metrics; Grafana on a port-forward (telemetry.yaml)

transformers:
  - image-tags.yaml          # the images built here, tag "local" (why not `images:`: see the file)

# Fixed names: the PostgreSQL operator and the Deployments refer to them by name.
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: continuum-secrets
    namespace: continuum
    envs: [secrets/continuum.env]
  - name: gateway-keys
    namespace: continuum
    files: [secrets/gateway-verdict-key.pem, secrets/gateway-identity-key.pem]
  - name: pg-gateway
    namespace: continuum
    type: kubernetes.io/basic-auth
    envs: [secrets/pg-gateway.env]
    options: { labels: { cnpg.io/reload: "true" } }
  - name: pg-ca
    namespace: continuum
    type: kubernetes.io/basic-auth
    envs: [secrets/pg-ca.env]
    options: { labels: { cnpg.io/reload: "true" } }
  - name: pg-passkey
    namespace: continuum
    type: kubernetes.io/basic-auth
    envs: [secrets/pg-passkey.env]
    options: { labels: { cnpg.io/reload: "true" } }
  - name: model-store
    namespace: continuum
    envs: [secrets/model-store.env]
  - name: seaweedfs-s3
    namespace: continuum-storage
    files: [s3.json=secrets/seaweedfs-s3.json]
  - name: demo-secrets
    namespace: continuum-demo
    envs: [secrets/demo.env]

patches:
  - path: local-urls.yaml
  - path: one-copy.yaml
  - path: telemetry.yaml
  - target: { kind: Gateway, name: continuum }
    patch: |-
      - op: replace
        path: /spec/listeners
        value:
          - name: api
            protocol: HTTP
            port: 28080
            allowedRoutes: { namespaces: { from: Same } }
          - name: demo
            protocol: HTTP
            port: 23000
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchLabels: { kubernetes.io/metadata.name: continuum-demo }
          - name: acme
            protocol: HTTP
            port: 24200
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchLabels: { kubernetes.io/metadata.name: continuum-demo }
