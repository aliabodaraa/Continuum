# Namespace continuum-demo: the reference integrations (apps/demo, apps/acme), how any organisation integrates
# Continuum. They reach Continuum only through the gateway (its tenant API and public pages), never an
# internal service.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: continuum-demo
labels:
  - pairs:
      app.kubernetes.io/part-of: continuum-demo
    includeSelectors: false
resources:
  - namespace.yaml
  - web.yaml
  - acme.yaml
  - mesh-policies.yaml
