apiVersion: v1
kind: Namespace
metadata:
  name: continuum-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    istio.io/dataplane-mode: ambient           # in the service mesh (deploy/platform/istio): mutual TLS between pods
