# Namespace continuum: the product. Every service, its database and the public entry point.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: continuum
labels:
  - pairs:
      app.kubernetes.io/part-of: continuum
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - gateway.yaml
  - ca-service.yaml
  - passkey-service.yaml
  - model.yaml
  - pg-backup.yaml
  - network-policies.yaml
  - edge.yaml
