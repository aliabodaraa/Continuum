# The public entry point (Gateway API, served by Envoy Gateway: deploy/platform). Two listeners: the API (the
# gateway service: SDK, extension, console, operator pages, tenant API) and the demo tenant's site (its route
# lives in namespace continuum-demo). Here plain HTTP with a hostname each; TLS (cert-manager) is added with
# a real domain. The local overlay replaces the listeners with two localhost ports.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: continuum
spec:
  gatewayClassName: envoy
  listeners:
    - name: api
      protocol: HTTP
      port: 80
      hostname: api.example.com
      allowedRoutes:
        namespaces: { from: Same }
    - name: demo
      protocol: HTTP
      port: 80
      hostname: demo.example.com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: continuum-demo }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - { name: continuum, sectionName: api }
  rules:
    - backendRefs:
        - { name: gateway, port: 8080 }
