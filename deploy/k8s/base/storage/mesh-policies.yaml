# The service mesh's rules for this namespace (see base/continuum/mesh-policies.yaml): mutual TLS only, and the model
# store answers the model pods and the daily database copy.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls: { mode: STRICT }
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: seaweedfs
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/continuum/sa/model
              - cluster.local/ns/continuum/sa/pg-backup
      to:
        - operation: { ports: ["8333"] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-health-probes
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 169.254.7.127/32 }
