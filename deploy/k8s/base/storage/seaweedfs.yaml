# SeaweedFS in one process (master, volume, filer and the S3 gateway), its data on one volume. Credentials:
# Secret seaweedfs-s3 (s3.json, made per environment by the overlay with the same keys as the model pods').
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels: { app.kubernetes.io/name: seaweedfs }
spec:
  replicas: 1
  strategy: { type: Recreate }           # one writer on one volume
  selector:
    matchLabels: { app.kubernetes.io/name: seaweedfs }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seaweedfs }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80   # the version the migration was proven with (step 6)
          args: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: seaweedfs-data }
        - name: s3-config
          secret: { secretName: seaweedfs-s3, defaultMode: 0440 }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels: { app.kubernetes.io/name: seaweedfs }
spec:
  selector: { app.kubernetes.io/name: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: s3 }
---
# Only the model pods reach the store.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: continuum }
          podSelector:
            matchLabels: { app.kubernetes.io/component: model }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: continuum }
          podSelector:
            matchLabels: { app.kubernetes.io/name: pg-backup }     # the daily database copy (pg-backup.yaml)
      ports:
        - { port: 8333, protocol: TCP }
        - { port: 15008, protocol: TCP }
