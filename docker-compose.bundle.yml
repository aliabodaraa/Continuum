# Continuum — the PRODUCT bundle. One command stands up the whole security layer
# (behavioral CA + FIDO2 passkey) behind a single API gateway. This is what a
# customer runs; they then include guard.js (client) + @continuum/node (server
# middleware) in their own app, pointed at the gateway.
#
# On the maintainer machine (has the source): build + push tagged images
#   REGISTRY=<dockerhub-user> TAG=0.1.0 docker compose -f docker-compose.bundle.yml build
#   REGISTRY=<dockerhub-user> TAG=0.1.0 docker compose -f docker-compose.bundle.yml push
# On any customer machine (needs only this file + .env): pull + run, no build
#   REGISTRY=<dockerhub-user> TAG=0.1.0 docker compose -f docker-compose.bundle.yml pull
#   docker compose -f docker-compose.bundle.yml up -d
#
# Only the gateway is exposed. Set secrets in .env (see .env.example). The host
# app's CONTINUUM_SECRET must equal CA_SIGNING_SECRET here. Image coordinates are
# ${REGISTRY}/<svc>:${TAG} — REGISTRY defaults to a local-only name so an
# unconfigured `build` still works for trying it out.
#
# NETWORK SEGMENTATION. Only the gateway is published, but publishing was the ONLY thing
# separating the tiers — every container shared one default bridge, so any of them could
# address model-api and score, train or roll back any user's biometric model. The `model`
# network now contains ca-service and model-api and nothing else, so the scoring oracle is
# reachable only from the service that holds a gateway-verified identity assertion.
services:
  model-api:
    build:
      context: .
      dockerfile: services/model-api/Dockerfile.model.prod
    image: ${REGISTRY:-continuum}/model-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      MODEL_HOST: 0.0.0.0
      MODEL_PORT: 5000
      MODEL_DEBUG: "0"
      MODEL_UNITS: ${MODEL_UNITS:-32}
      # REQUIRED. Without it the scoring/training endpoints are unauthenticated and anything
      # that can reach the container is a biometric oracle. Generate: openssl rand -hex 32
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY in .env (openssl rand -hex 32)}
    expose: ["5000"]
    networks: [model]
    healthcheck:
      # TensorFlow needs tens of seconds to load; dependants must wait for READY, not
      # merely for the container to exist. /health is the one unauthenticated route.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    volumes:
      - continuum_user_models:/app/artifacts/users

  ca-service:
    build:
      context: ./services/ca-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-continuum}/ca-service:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      model-api:
        condition: service_healthy
    environment:
      PORT: 4100
      MODEL_API_URL: http://model-api:5000
      # Must equal model-api's MODEL_API_KEY — this is the credential for that hop.
      MODEL_API_KEY: ${MODEL_API_KEY:?Set MODEL_API_KEY in .env (openssl rand -hex 32)}
      # Deadline on the model call: past it, no verdict is issued rather than hanging.
      MODEL_INFER_TIMEOUT_MS: ${MODEL_INFER_TIMEOUT_MS:-5000}
      MODEL_TRAIN_TIMEOUT_MS: ${MODEL_TRAIN_TIMEOUT_MS:-600000}
      DB_PATH: /app/data/ca.db
      LOG_FORMAT: ${LOG_FORMAT:-}   # json = one JSON object per log line (for a log collector)
      CA_API_KEY: ${CA_API_KEY:-}
      # Signs the risk verdicts; the host's @continuum/node uses the SAME value.
      # REQUIRED — no shared fallback, or every deployment would sign with the
      # same key (verdicts forgeable across tenants). Generate: openssl rand -hex 32
      CA_SIGNING_SECRET: ${CA_SIGNING_SECRET:?Set CA_SIGNING_SECRET in .env (openssl rand -hex 32)}
      # Defaults for every organisation's protection (the operator page and each organisation's console
      # override them; services/gateway/settings.js). Keep the same values on the gateway.
      ONBOARDING_MODE: ${ONBOARDING_MODE:-eager}
      MONITOR_EXCLUDE_TYPES: ${MONITOR_EXCLUDE_TYPES:-hidden}
      CONTINUUM_PANEL: ${CONTINUUM_PANEL:-show}
      CONTINUUM_KEYSTROKE: ${CONTINUUM_KEYSTROKE:-on}
      CONTINUUM_MOUSE: ${CONTINUUM_MOUSE:-on}
      ADAPTIVE_RETRAINING: ${ADAPTIVE_RETRAINING:-on}
      ADAPTIVE_MIN_GAP_HOURS: ${ADAPTIVE_MIN_GAP_HOURS:-3}
      KEYSTROKE_DECISION_WINDOWS: ${KEYSTROKE_DECISION_WINDOWS:-20}
    expose: ["4100"]
    # The only service on both networks — the sole path to the model.
    networks: [internal, model]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - continuum_ca_db:/app/data

  passkey-service:
    build:
      context: ./services/passkey-service
      dockerfile: Dockerfile
    image: ${REGISTRY:-continuum}/passkey-service:${TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 4000
      RP_ID: ${RP_ID:-localhost}
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      DB_PATH: /app/data/passkey.db
      LOG_FORMAT: ${LOG_FORMAT:-}   # json = one JSON object per log line (for a log collector)
      PASSKEY_API_KEY: ${PASSKEY_API_KEY:-}
    expose: ["4000"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - continuum_passkey_db:/app/data

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
      # Inject the top-level SDK so the image can serve guard.js without a mount.
      additional_contexts:
        sdk: ./sdk
    image: ${REGISTRY:-continuum}/gateway:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      ca-service:
        condition: service_healthy
      passkey-service:
        condition: service_healthy
    environment:
      PORT: 8080
      CA_API_URL: http://ca-service:4100
      PASSKEY_API_URL: http://passkey-service:4000
      # Signing key + tenant registry are generated/seeded here on first run and
      # persist across restarts — NOT baked into the image (see gateway/.dockerignore).
      DATA_DIR: /app/data
      LOG_FORMAT: ${LOG_FORMAT:-}   # json = one JSON object per log line (for a log collector)
      # The auto-seeded demo tenant's secret; a consumer signing identities must use
      # the SAME value. REQUIRED (no shared fallback). Generate: openssl rand -hex 32
      CA_SIGNING_SECRET: ${CA_SIGNING_SECRET:?Set CA_SIGNING_SECRET in .env (openssl rand -hex 32)}
      # Signs session tokens AND derives this deployment's user-id namespace. REQUIRED
      # and must be UNIQUE per deployment — a shared value makes session tokens forgeable
      # and user ids identical across installs. Generate: openssl rand -hex 32
      GATEWAY_SESSION_SECRET: ${GATEWAY_SESSION_SECRET:?Set GATEWAY_SESSION_SECRET in .env (openssl rand -hex 32)}
      # Gates tenant registration (X-Admin-Key). REQUIRED: unset, registration would be open
      # to anyone who can reach the gateway. Generate: openssl rand -hex 32
      GATEWAY_ADMIN_KEY: ${GATEWAY_ADMIN_KEY:?Set GATEWAY_ADMIN_KEY in .env (openssl rand -hex 32)}
      # Where the operator page and admin API answer at all (default: this machine only;
      # see DEPLOY.md), whether console webhooks may be private addresses (testing only),
      # and whether console sign-ups skip the operator's approval.
      GATEWAY_OPERATOR_HOSTS: ${GATEWAY_OPERATOR_HOSTS:-}
      # Defaults for every organisation's protection (the operator page and each organisation's console
      # override them; services/gateway/settings.js). Keep the same values on ca-service.
      ONBOARDING_MODE: ${ONBOARDING_MODE:-eager}
      MONITOR_EXCLUDE_TYPES: ${MONITOR_EXCLUDE_TYPES:-hidden}
      CONTINUUM_PANEL: ${CONTINUUM_PANEL:-show}
      CONTINUUM_KEYSTROKE: ${CONTINUUM_KEYSTROKE:-on}
      CONTINUUM_MOUSE: ${CONTINUUM_MOUSE:-on}
      ADAPTIVE_RETRAINING: ${ADAPTIVE_RETRAINING:-on}
      ADAPTIVE_MIN_GAP_HOURS: ${ADAPTIVE_MIN_GAP_HOURS:-3}
      KEYSTROKE_DECISION_WINDOWS: ${KEYSTROKE_DECISION_WINDOWS:-20}
      # Where browsers reach the gateway (its console, operator and extension pages, and the
      # passkeys made on them), and the Continuum Guard extension's id.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      # Where its records live: json files (DATA_DIR) or postgres (DATABASE_URL); see .env.example.
      STORAGE: ${STORAGE:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      CONTINUUM_EXTENSION_ID: ${CONTINUUM_EXTENSION_ID:-}
      # Only when the demo app runs as a tenant next to the bundle (docker-compose.prod.yml): its sign-in
      # page for the extension and its risk-change receiver. Empty for a plain product install.
      DEMO_SIGNIN_URL: ${DEMO_SIGNIN_URL:-}
      DEMO_WEBHOOK_URL: ${DEMO_WEBHOOK_URL:-}
      GATEWAY_ALLOW_PRIVATE_WEBHOOKS: ${GATEWAY_ALLOW_PRIVATE_WEBHOOKS:-0}
      GATEWAY_AUTO_APPROVE_TENANTS: ${GATEWAY_AUTO_APPROVE_TENANTS:-0}
      # Comma-separated tenant API keys (blank = open, for local dev only).
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:-}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    # Public on `edge`; the only bridge into `internal`. Never on `model`.
    networks: [edge, internal]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - continuum_gateway_data:/app/data   # RS256 signing key + tenant registry (persistent)

networks:
  edge:
  internal:
  model:

volumes:
  continuum_gateway_data:
  continuum_user_models:
  continuum_ca_db:
  continuum_passkey_db:
