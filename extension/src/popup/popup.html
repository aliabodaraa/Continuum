<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #0b1120;
        --card: #131c31;
        --card-border: #1f2c47;
        --text: #e7ecf6;
        --muted: #8b98b3;
        --indigo: #4f46e5;
        --indigo-hi: #6366f1;
        --teal: #0e9488;
        --teal-hi: #14b8a6;
        --green: #16a34a;
        --red: #ef4444;
        --slate: #263248;
        --slate-hi: #324160;
        --radius-lg: 18px;
        --radius-md: 12px;
        --radius-sm: 8px;
      }
      * { box-sizing: border-box; }
      body {
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        width: 288px; margin: 0; padding: 16px;
        background: radial-gradient(120% 140% at 0% 0%, #101c36 0%, var(--bg) 55%);
        color: var(--text);
      }
      h1 {
        font-size: 14.5px; font-weight: 800; letter-spacing: .1px;
        margin: 0 0 12px; display: flex; align-items: center; gap: 9px;
      }
      .badge {
        width: 26px; height: 26px; border-radius: 9px;
        background: linear-gradient(145deg, var(--indigo-hi), #4338ca);
        display: flex; align-items: center; justify-content: center; font-size: 14px;
        box-shadow: 0 2px 8px rgba(79,70,229,.45);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-left: auto; box-shadow: 0 0 0 3px rgba(22,163,74,.18); }
      .dot.off { background: #58698c; box-shadow: 0 0 0 3px rgba(88,105,140,.18); }

      #verdict {
        border-radius: var(--radius-lg);
        padding: 13px 15px;
        margin: 0 0 12px;
        font-weight: 700;
        font-size: 12.5px;
        background: var(--card);
        border: 1px solid var(--card-border);
        transition: background .25s ease;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 4px 13px;
        margin-bottom: 12px;
      }
      .row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--card-border);
      }
      .row:last-child { border-bottom: none; }
      .row span:first-child { color: var(--muted); font-weight: 500; }
      .val { font-weight: 700; }

      button {
        border: 0; border-radius: var(--radius-md);
        padding: 11px 14px;
        font: 700 12.5px/1.2 system-ui;
        cursor: pointer;
        width: 100%;
        color: #fff;
        background: var(--slate);
        transition: filter .15s ease, transform .05s ease;
        text-align: center;
      }
      button:hover { filter: brightness(1.12); }
      button:active { transform: scale(.985); }
      button.stack { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; }
      button .sub { font-weight: 500; font-size: 10.5px; opacity: .78; }

      .btn-primary { background: linear-gradient(145deg, var(--indigo-hi), var(--indigo)); box-shadow: 0 3px 10px rgba(79,70,229,.35); }
      .btn-teal { background: linear-gradient(145deg, var(--teal-hi), var(--teal)); box-shadow: 0 3px 10px rgba(13,148,136,.3); }
      .btn-slate { background: var(--slate); }
      .btn-slate:hover { background: var(--slate-hi); filter: none; }
      .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--muted); box-shadow: none; }
      .btn-outline:hover { background: var(--card); filter: none; color: var(--text); }

      .gap { height: 8px; }
      .muted { color: var(--muted); font-size: 10.5px; margin-top: 12px; line-height: 1.5; }
      .muted b { color: #b7c2dc; }
    </style>
  </head>
  <body>
    <h1><span class="badge">🛡️</span> Continuum Guard <span class="dot" id="dot"></span></h1>

    <div id="verdict">…</div>

    <div class="card">
      <div class="row"><span>Status</span><span class="val" id="state">…</span></div>
      <div class="row"><span>Model</span><span class="val" id="model">…</span></div>
      <div class="row"><span>Steps → 1st window</span><span class="val" id="steps">0/50</span></div>
      <div class="row"><span>Windows scored</span><span class="val" id="wins">0</span></div>
      <div class="row"><span>Mouse</span><span class="val" id="mouse">…</span></div>
      <div class="row"><span>This site</span><span class="val" id="site">…</span></div>
      <div class="row"><span>Your profile</span><span class="val" id="profile">…</span></div>
    </div>

    <button id="enroll" class="btn-teal stack">
      <span>🎓 Train Continuum on you</span>
      <span class="sub">~2 min · captures your typing &amp; mouse movement</span>
    </button>
    <div class="gap"></div>
    <button id="toggle" class="btn-primary">…</button>
    <div class="gap"></div>
    <button id="exclude" class="btn-outline">…</button>

    <div class="muted">Capturing your <b>rhythm</b> on-device — keystrokes and mouse movement never leave your browser.</div>
    <script src="popup.js"></script>
  </body>
</html>
