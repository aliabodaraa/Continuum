<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <!-- Hidden offscreen document: hosts TensorFlow.js in a DOM context (the service
         worker can't run it — no document/window). It loads the model once and answers
         single-window scoring requests from the background worker. -->
    <!-- eval-free minimal TF.js (core + cpu + converter) — the full UMD build trips the
         MV3 CSP because its legacy polyfills call Function()/eval. -->
    <script src="../vendor/tf-lite.js"></script>
    <script src="mouse-model.js"></script>
    <script src="scoring.js"></script>
    <script src="offscreen.js"></script>
  </body>
</html>
