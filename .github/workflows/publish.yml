name: Publish images to Docker Hub

# Rebuilds and pushes the frequently-changing service images on every push to
# main (and on demand). model-api is intentionally NOT here: its build bakes a
# 119 MB mouse dataset that is too large for git, and its Python/model code
# rarely changes — publish it manually with scripts/release.sh (see PUBLISHING.md).
on:
  push:
    branches: [main]
    paths:
      - "services/ca-service/**"
      - "services/passkey-service/**"
      - "services/gateway/**"
      - "apps/demo/**"
      - "sdk/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

env:
  REGISTRY: aliabodaraa   # your Docker Hub namespace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short commit SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: ca-service
        uses: docker/build-push-action@v6
        with:
          context: services/ca-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/ca-service:latest
            ${{ env.REGISTRY }}/ca-service:${{ steps.meta.outputs.sha }}

      - name: passkey-service
        uses: docker/build-push-action@v6
        with:
          context: services/passkey-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/passkey-service:latest
            ${{ env.REGISTRY }}/passkey-service:${{ steps.meta.outputs.sha }}

      # gateway + web-demo bake the SDK from the top-level sdk/ named build context.
      - name: gateway
        uses: docker/build-push-action@v6
        with:
          context: services/gateway
          build-contexts: |
            sdk=./sdk
          push: true
          tags: |
            ${{ env.REGISTRY }}/gateway:latest
            ${{ env.REGISTRY }}/gateway:${{ steps.meta.outputs.sha }}

      - name: web-demo
        uses: docker/build-push-action@v6
        with:
          context: apps/demo
          build-contexts: |
            sdk=./sdk
          push: true
          tags: |
            ${{ env.REGISTRY }}/web-demo:latest
            ${{ env.REGISTRY }}/web-demo:${{ steps.meta.outputs.sha }}
