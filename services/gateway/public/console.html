<!doctype html>
<!--
  Continuum Console (served by the gateway at /console.html) — where an ORGANISATION manages its use of
  Continuum. An organisation's developer signs in with a Continuum account (email + passkey), registers
  organisations (tenants) in a short wizard, and on each organisation's page finds its keys, websites,
  browser-extension sign-in, risk-change webhook (with a test), user counts and activity. New organisations
  wait for the operator's approval; the operator works on a separate page, /operator.html, that only opens
  on the operator's own machine. API: services/gateway/server.js ("TENANT REGISTRY", "developer console").
  English, or Arabic right-to-left: the language button on the page (ui/ui.js "language", ui/i18n-ar.js).
-->
