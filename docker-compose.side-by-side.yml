# A second, complete Continuum stack next to the running one, for proving a change on a COPY of the data
# before switching over (the migration plan: build the new beside the old). Its own project name keeps its
# containers, networks and volumes apart; its own ports keep it off the running stack's; the data it reads
# is the copy restored into this checkout (scripts/data-import.sh --target), never the running stack's.
#
#   docker compose -p continuum-next -f docker-compose.yml -f docker-compose.side-by-side.yml up -d postgres
#   docker compose -p continuum-next -f docker-compose.yml -f docker-compose.side-by-side.yml run --rm --no-deps \
#     gateway node migrate.js --from /app --to postgres://continuum:continuum@postgres:5432/continuum
#   docker compose -p continuum-next -f docker-compose.yml -f docker-compose.side-by-side.yml up -d gateway web
#
# Gateway http://localhost:18080, demo http://localhost:13000. The gateway keeps its records in PostgreSQL.
# Remove everything again with: ... down -v (the copy's files in this checkout stay).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: continuum   # a throwaway local copy; a real deployment takes this from its secret store
      POSTGRES_DB: continuum
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U continuum -d continuum"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  gateway:
    environment:
      STORAGE: ${SIDE_BY_SIDE_STORAGE:-postgres}   # json runs the same code on this copy's files
      DATABASE_URL: postgres://continuum:continuum@postgres:5432/continuum
      GATEWAY_PUBLIC_URL: http://localhost:18080
      DEMO_SIGNIN_URL: http://localhost:13000/continuum/link
      # An unpacked extension's id follows its folder, so the copy in this checkout has its own: give it
      # here (chrome://extensions, or the first line the e2e tests print) to admit it.
      CONTINUUM_EXTENSION_ID: ${SIDE_BY_SIDE_EXTENSION_ID:-${CONTINUUM_EXTENSION_ID:-}}
    depends_on:
      postgres:
        condition: service_healthy
    ports: !override
      - "18080:8080"

  web:
    environment:
      ORIGIN: http://localhost:13000
      CONTINUUM_GATEWAY_URL: http://localhost:18080
    ports: !override
      - "13000:3000"

  passkey-service:
    environment:
      ORIGIN: http://localhost:13000

  acme:
    ports: !override
      - "14200:4200"

volumes:
  postgres_data:
